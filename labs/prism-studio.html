<title>Prism Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Familjen+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg-top:#e7e8ee;--bg-mid:#d3d5dd;--bg-lo:#c5c7d1;
    --fg:#14151c;--fg-dim:#565a67;--fg-faint:#8b8e9a;--line:rgba(20,22,34,.18);
    --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Familjen Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{color:var(--fg);font-family:var(--body);height:100svh;overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 52%,var(--bg-lo) 100%)}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:multiply;
    background-image:radial-gradient(circle,#000 0.5px,transparent 0.6px);background-size:3px 3px}
  #loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-faint);font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase}

  nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
    padding:22px clamp(24px,6vw,64px);font-family:var(--mono);font-size:12px;letter-spacing:.14em}
  nav .brand{color:var(--fg);font-weight:500}
  nav .links{display:flex;gap:28px}
  nav a{color:var(--fg-dim);text-decoration:none;transition:color .2s}nav a:hover{color:var(--fg)}

  .hero{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 24px 8vh;pointer-events:none}
  .hero>*{pointer-events:auto}
  .badge{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;
    padding:8px 16px;border-radius:100px;border:1px solid var(--line);background:rgba(255,255,255,.5);color:var(--fg-dim);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin-bottom:28px}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#12a150;box-shadow:0 0 9px rgba(18,161,80,.7)}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2.7rem,7.4vw,6rem);line-height:.96;letter-spacing:-.035em;margin:0;max-width:16ch;text-wrap:balance;color:var(--fg)}
  h1 .g{background:linear-gradient(100deg,#5b46d6,#1f8fbf 55%,#c0479a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:clamp(1.02rem,1.7vw,1.28rem);line-height:1.5;color:var(--fg-dim);max-width:48ch;margin:26px 0 0;font-weight:400}
  .cta{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:var(--body);font-size:15px;font-weight:500;padding:14px 28px;border-radius:100px;cursor:pointer;text-decoration:none;
    border:1px solid var(--line);color:var(--fg);background:rgba(255,255,255,.35);transition:background .25s,transform .2s,box-shadow .25s}
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:var(--fg);color:#f3f3f7;border-color:var(--fg);box-shadow:0 10px 30px rgba(20,22,40,.22)}
  .btn.primary:hover{box-shadow:0 12px 38px rgba(20,22,40,.32)}
  .btn.ghost:hover{background:rgba(255,255,255,.6)}
  .foot{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--fg-faint);text-transform:uppercase}
  @media (max-width:720px){nav .links{display:none}}
</style>

<div id="stage">
  <canvas id="gl"></canvas>
  <div id="grain"></div>
  <div id="loading">setting up the studio…</div>
</div>

<nav>
  <span class="brand">MUHAMMAD AHMAD</span>
  <span class="links"><a href="#">Work</a><a href="#">About</a><a href="#">Writing</a><a href="#">Contact</a></span>
</nav>

<div class="hero">
  <span class="badge"><span class="dot"></span> Available for new work</span>
  <h1>I build software<br>that feels <span class="g">alive</span>.</h1>
  <p class="sub">Engineer and designer shipping interfaces, tools, and systems — with an eye for how they move, not just what they do.</p>
  <div class="cta"><a class="btn primary" href="#">View the work</a><a class="btn ghost" href="#">Get in touch</a></div>
</div>
<div class="foot">move the cursor</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!window.THREE){document.getElementById("loading").textContent="3D failed to load";}
else (function(){
  const DPR=Math.min(devicePixelRatio||1,RM?1:1.8);
  const canvas=document.getElementById("gl");
  const WALL=0xd0d2da;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(DPR);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(WALL,0.05);
  const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,0.7,9);

  // bright studio environment for crisp glass
  function env(){const c=document.createElement("canvas");c.width=512;c.height=256;const g=c.getContext("2d");
    const grd=g.createLinearGradient(0,0,0,256);grd.addColorStop(0,"#ffffff");grd.addColorStop(.5,"#d7dae6");grd.addColorStop(1,"#b7bccc");g.fillStyle=grd;g.fillRect(0,0,512,256);
    for(const[x,y,col,r] of[[130,60,"#ffffff",80],[380,50,"#dfe6ff",90],[250,150,"#eafbff",70],[70,180,"#ffe6f4",60]]){
      const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,col);rg.addColorStop(1,"transparent");g.fillStyle=rg;g.fillRect(0,0,512,256);}
    const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;
    const pm=new THREE.PMREMGenerator(renderer);const e=pm.fromEquirectangular(t).texture;t.dispose();pm.dispose();return e;}
  scene.environment=env();

  // ---- the room ----
  const FLOOR=-1.6;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),
    new THREE.MeshStandardMaterial({color:0xc7cad4,roughness:.42,metalness:.15,envMapIntensity:.7}));
  floor.rotation.x=-Math.PI/2;floor.position.y=FLOOR;floor.receiveShadow=true;scene.add(floor);

  // ---- light ----
  scene.add(new THREE.HemisphereLight(0xffffff,0xb7bccc,.7));
  const key=new THREE.DirectionalLight(0xffffff,2.1);key.position.set(4,9,6);key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);key.shadow.radius=8;key.shadow.bias=-0.0004;
  const cam=key.shadow.camera;cam.left=-8;cam.right=8;cam.top=8;cam.bottom=-8;cam.near=1;cam.far=30;scene.add(key);
  const l1=new THREE.PointLight(0x8b5cf6,26,40);l1.position.set(-6,2,4);scene.add(l1);
  const l2=new THREE.PointLight(0x22d3ee,24,40);l2.position.set(6,-1,3);scene.add(l2);

  const glass=new THREE.MeshPhysicalMaterial({
    transmission:1, thickness:2.6, ior:1.52, roughness:.02, metalness:0,
    iridescence:1, iridescenceIOR:1.32, iridescenceThicknessRange:[130,460],
    clearcoat:1, clearcoatRoughness:.05, envMapIntensity:1.7,
    attenuationColor:new THREE.Color(0xdfe6ff), attenuationDistance:7, color:0xffffff });

  const group=new THREE.Group();scene.add(group);
  const defs=[
    {r:1.6,h:3.0,x:0,y:0,z:-.6,sp:1},
    {r:1.0,h:1.8,x:-3.5,y:0,z:.6,sp:.85},
    {r:1.15,h:2.1,x:3.3,y:0,z:.1,sp:1.1},
    {r:.72,h:1.3,x:-2.2,y:0,z:1.3,sp:1.25},
    {r:.62,h:1.1,x:2.2,y:0,z:1.4,sp:.9},
  ];
  const prisms=[];
  for(const d of defs){const m=new THREE.Mesh(new THREE.CylinderGeometry(d.r,d.r,d.h,3,1),glass);
    m.castShadow=true; m.position.set(d.x,FLOOR+d.h/2,d.z);
    m.rotation.y=Math.random()*3; m.userData={sp:d.sp,fy:Math.random()*6,by:FLOOR+d.h/2};
    group.add(m);prisms.push(m);}
  const chrome=new THREE.MeshStandardMaterial({color:0xf0f3ff,metalness:1,roughness:.12,envMapIntensity:1.3});
  for(let i=0;i<5;i++){const s=new THREE.Mesh(new THREE.OctahedronGeometry(.15),chrome);s.castShadow=true;
    s.position.set((Math.random()-.5)*8,FLOOR+.3+Math.random()*1.5,.5+Math.random()*1.5);group.add(s);}

  const p={x:0,y:0,tx:0,ty:0};
  addEventListener("pointermove",e=>{p.tx=e.clientX/innerWidth-.5;p.ty=e.clientY/innerHeight-.5;});
  function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
  addEventListener("resize",resize);resize();
  document.getElementById("loading").style.display="none";

  let t0=performance.now();
  function frame(now){
    const t=(now-t0)/1000;
    p.x+=(p.tx-p.x)*.045;p.y+=(p.ty-p.y)*.045;
    prisms.forEach(m=>{if(!RM){m.rotation.y+=.0034*m.userData.sp;
      m.position.y=m.userData.by+Math.sin(t*.5+m.userData.fy)*.12;}});
    group.rotation.y=p.x*.35;
    camera.position.x=p.x*1.4;camera.position.y=0.7-p.y*.6;camera.lookAt(0,-0.3,0);
    renderer.render(scene,camera);
    if(!RM)requestAnimationFrame(frame);
  }
  if(RM)frame(0);else requestAnimationFrame(frame);
})();
</script>
