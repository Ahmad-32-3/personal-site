<title>Prism Studio · Contrast</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Familjen+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{--ink:#05060c;--fg:#f2f3f7;--fg-dim:#a6a9b8;--fg-faint:#5c5f70;--line:rgba(255,255,255,.14);
    --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Familjen Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--fg);font-family:var(--body);height:100svh;overflow:hidden;-webkit-font-smoothing:antialiased}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #top{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,6,12,.7),transparent 22%)}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(100% 80% at 50% 52%,transparent 46%,rgba(4,5,11,.6))}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--fg-faint);font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
  nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
    padding:22px clamp(24px,6vw,64px);font-family:var(--mono);font-size:12px;letter-spacing:.14em}
  nav .brand{color:var(--fg);font-weight:500}nav .links{display:flex;gap:28px}
  nav a{color:var(--fg-dim);text-decoration:none;transition:color .2s}nav a:hover{color:var(--fg)}
  .hero{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 24px 6vh;pointer-events:none}
  .hero>*{pointer-events:auto}
  .badge{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;
    padding:8px 16px;border-radius:100px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg-dim);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:28px}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#57e389;box-shadow:0 0 10px #57e389}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2.7rem,7.4vw,6rem);line-height:.96;letter-spacing:-.035em;margin:0;max-width:16ch;text-wrap:balance;
    text-shadow:0 4px 40px rgba(0,0,0,.5)}
  h1 .g{background:linear-gradient(100deg,#c9b8ff,#8fd6ff 60%,#f5c2e7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:clamp(1.02rem,1.7vw,1.28rem);line-height:1.5;color:var(--fg-dim);max-width:48ch;margin:26px 0 0;text-shadow:0 2px 20px rgba(0,0,0,.6)}
  .cta{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:var(--body);font-size:15px;font-weight:500;padding:14px 28px;border-radius:100px;cursor:pointer;text-decoration:none;
    border:1px solid var(--line);color:var(--fg);background:rgba(255,255,255,.04);transition:background .25s,transform .2s,box-shadow .25s}
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:var(--fg);color:#0a0b12;border-color:var(--fg);box-shadow:0 10px 34px rgba(160,180,255,.28)}
  .btn.ghost:hover{background:rgba(255,255,255,.08)}
  .foot{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--fg-faint);text-transform:uppercase}
  @media (max-width:720px){nav .links{display:none}}
</style>

<canvas id="gl"></canvas>
<div id="top"></div><div id="vig"></div>
<div id="loading">warming the shader…</div>

<nav><span class="brand">MUHAMMAD AHMAD</span>
  <span class="links"><a href="#">Work</a><a href="#">About</a><a href="#">Writing</a><a href="#">Contact</a></span></nav>

<div class="hero">
  <span class="badge"><span class="dot"></span> Available for new work</span>
  <h1>I build software<br>that feels <span class="g">alive</span>.</h1>
  <p class="sub">Engineer and designer shipping interfaces, tools, and systems — with an eye for how they move, not just what they do.</p>
  <div class="cta"><a class="btn primary" href="#">View the work</a><a class="btn ghost" href="#">Get in touch</a></div>
</div>
<div class="foot">move the cursor</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!window.THREE){document.getElementById("loading").textContent="3D failed to load";}
else (function(){
  const DPR=Math.min(devicePixelRatio||1,RM?1:1.8);
  const canvas=document.getElementById("gl");
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(DPR);renderer.setClearColor(0x05060c,1);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x05060c,0.045);
  const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,120);camera.position.set(0,0.6,9);

  // bright env for crisp glass highlights (high contrast)
  function env(){const c=document.createElement("canvas");c.width=512;c.height=256;const g=c.getContext("2d");
    const grd=g.createLinearGradient(0,0,0,256);grd.addColorStop(0,"#cfd8ff");grd.addColorStop(.5,"#161a30");grd.addColorStop(1,"#04050b");g.fillStyle=grd;g.fillRect(0,0,512,256);
    for(const[x,y,col,r] of[[130,50,"#ffffff",70],[380,44,"#bcd0ff",90],[250,150,"#8ff6ff",60],[70,180,"#ffc9ec",50]]){
      const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,col);rg.addColorStop(1,"transparent");g.fillStyle=rg;g.fillRect(0,0,512,256);}
    const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;
    const pm=new THREE.PMREMGenerator(renderer);const e=pm.fromEquirectangular(t).texture;t.dispose();pm.dispose();return e;}
  scene.environment=env();

  // ---- vgpu-style GLSL backdrop wall (the light source the glass refracts) ----
  const wallMat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0}},fog:false,
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`precision highp float;varying vec2 vUv;uniform float uTime;
      float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);float a=h(i),b=h(i+vec2(1,0)),c=h(i+vec2(0,1)),d=h(i+vec2(1,1));vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
      float fbm(vec2 p){float s=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<5;i++){s+=a*n(p);p=m*p;a*=.5;}return s;}
      void main(){vec2 p=vUv*3.0;float t=uTime*0.05;
        vec2 q=vec2(fbm(p+vec2(0.,t)),fbm(p+vec2(5.2,-t)));
        float f=fbm(p+2.5*q);
        vec3 lo=vec3(0.02,0.03,0.08),mid=vec3(0.16,0.10,0.42),hi=vec3(0.32,0.72,0.98);
        vec3 col=mix(lo,mid,clamp(f*1.5,0.,1.));col=mix(col,hi,clamp(pow(q.x,2.)*1.2,0.,1.));
        col*=0.5+0.9*f;                       // deep darks, bright streaks = contrast
        gl_FragColor=vec4(col,1.);}`
  });
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(90,52),wallMat);
  wall.position.set(0,6,-16);scene.add(wall);

  // ---- floor + shadows ----
  const FLOOR=-1.6;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(160,160),
    new THREE.MeshStandardMaterial({color:0x0a0c15,roughness:.28,metalness:.4,envMapIntensity:1}));
  floor.rotation.x=-Math.PI/2;floor.position.y=FLOOR;floor.receiveShadow=true;scene.add(floor);

  scene.add(new THREE.HemisphereLight(0x9db0ff,0x05060c,.35));
  const key=new THREE.DirectionalLight(0xffffff,2.6);key.position.set(5,10,6);key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);key.shadow.radius=9;key.shadow.bias=-0.0004;
  const sc=key.shadow.camera;sc.left=-9;sc.right=9;sc.top=9;sc.bottom=-9;sc.near=1;sc.far=34;scene.add(key);
  const l1=new THREE.PointLight(0x7a5cff,40,44);l1.position.set(-7,2,3);scene.add(l1);
  const l2=new THREE.PointLight(0x22d3ee,36,44);l2.position.set(7,-1,3);scene.add(l2);

  const glass=()=>new THREE.MeshPhysicalMaterial({transmission:1,thickness:2.8,ior:1.53,roughness:.02,metalness:0,
    iridescence:1,iridescenceIOR:1.34,iridescenceThicknessRange:[120,500],clearcoat:1,clearcoatRoughness:.04,
    envMapIntensity:1.9,attenuationColor:new THREE.Color(0xcfe0ff),attenuationDistance:7,color:0xffffff});

  const group=new THREE.Group();scene.add(group);
  // varied SHAPES
  const shapes=[
    {g:new THREE.CylinderGeometry(1.5,1.5,3.0,6,1),x:0,z:-.6,rs:[.001,.004,.0015]},      // hex prism (center)
    {g:new THREE.CylinderGeometry(1.0,1.0,1.9,3,1),x:-3.5,z:.5,rs:[.006,.003,.002]},      // triangular
    {g:new THREE.CylinderGeometry(1.1,1.1,2.0,3,1),x:3.3,z:.1,rs:[.002,.007,.003]},       // triangular
    {g:new THREE.OctahedronGeometry(1.05,0),x:-2.1,z:1.4,rs:[.005,.004,.006]},            // diamond
    {g:new THREE.TorusKnotGeometry(.7,.24,120,16),x:2.3,z:1.3,rs:[.004,.006,.002]},       // knot
  ];
  const items=[];
  shapes.forEach((s,i)=>{const geo=s.g;const box=new THREE.Box3().setFromObject(new THREE.Mesh(geo));const h=box.max.y-box.min.y;
    const m=new THREE.Mesh(geo,glass());m.castShadow=true;
    m.position.set(s.x,FLOOR+h/2+ (i===0?0:.2),s.z);m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    m.userData={rs:s.rs,fy:Math.random()*6,by:m.position.y};group.add(m);items.push(m);});
  const chrome=new THREE.MeshStandardMaterial({color:0xeef2ff,metalness:1,roughness:.1,envMapIntensity:1.5});
  for(let i=0;i<6;i++){const s=new THREE.Mesh(new THREE.OctahedronGeometry(.14),chrome);s.castShadow=true;
    s.position.set((Math.random()-.5)*9,FLOOR+.3+Math.random()*2,.4+Math.random()*1.6);group.add(s);}

  const p={x:0,y:0,tx:0,ty:0};
  addEventListener("pointermove",e=>{p.tx=e.clientX/innerWidth-.5;p.ty=e.clientY/innerHeight-.5;});
  function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
  addEventListener("resize",resize);resize();
  document.getElementById("loading").style.display="none";

  let t0=performance.now();
  function frame(now){const t=(now-t0)/1000;
    wallMat.uniforms.uTime.value=t;
    p.x+=(p.tx-p.x)*.045;p.y+=(p.ty-p.y)*.045;
    items.forEach(m=>{if(!RM){m.rotation.x+=m.userData.rs[0];m.rotation.y+=m.userData.rs[1];m.rotation.z+=m.userData.rs[2];
      m.position.y=m.userData.by+Math.sin(t*.5+m.userData.fy)*.13;}});
    group.rotation.y=p.x*.32;
    camera.position.x=p.x*1.5;camera.position.y=0.6-p.y*.6;camera.lookAt(0,-0.3,0);
    renderer.render(scene,camera);
    if(!RM)requestAnimationFrame(frame);
  }
  if(RM)frame(0);else requestAnimationFrame(frame);
})();
</script>
