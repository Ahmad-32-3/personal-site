<div class="lower"><p class="eyebrow">Engineer · Builder</p>
  <p class="tagline">Interfaces, tools, and systems — with an eye for how they feel.</p>
  <div class="cta"><a class="btn primary" href="#">View work</a><a class="btn" href="#">Get in touch</a></div></div>
<script>
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const DPR=Math.min(devicePixelRatio||1,RM?1:2);
const cv=document.getElementById("c"),x=cv.getContext("2d");
const NAME=["MUHAMMAD","AHMAD"]; let W,H,cx,cy;
const p={tx:0,ty:0,x:0,y:0,mx:-9999,my:-9999,on:0};
addEventListener("pointermove",e=>{p.tx=e.clientX/innerWidth-.5;p.ty=e.clientY/innerHeight-.5;p.mx=e.clientX*DPR;p.my=e.clientY*DPR;p.on=1;});
addEventListener("pointerleave",()=>p.on=0);
let name=[],stars=[],orbit=[],bok=[];
function sampleName(){
  const o=document.createElement("canvas");o.width=innerWidth;o.height=innerHeight;const g=o.getContext("2d");
  g.fillStyle="#fff";g.textAlign="center";g.textBaseline="middle";
  const fs=Math.min(innerWidth*0.145,innerHeight*0.24,190);g.font=`800 ${fs}px "Bricolage Grotesque",sans-serif`;
  const X=innerWidth/2,Y=innerHeight*0.42;g.fillText(NAME[0],X,Y-fs*0.42);g.fillText(NAME[1],X,Y+fs*0.5);
  const d=g.getImageData(0,0,innerWidth,innerHeight).data,st=innerWidth<720?6:4,pts=[];
  for(let yy=0;yy<innerHeight;yy+=st)for(let xx=0;xx<innerWidth;xx+=st)if(d[(yy*innerWidth+xx)*4+3]>128)pts.push([xx,yy]);
  const MAX=innerWidth<720?2800:5500,s=Math.max(1,Math.ceil(pts.length/MAX)),out=[];
  for(let i=0;i<pts.length;i+=s)out.push(pts[i]);return out;
}
function build(){
  W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;cx=W/2;cy=H*0.42;
  name=sampleName().map(([tx,ty])=>({tx:tx*DPR,ty:ty*DPR,x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,ph:Math.random()*6,sp:.4+Math.random()*.7,c:tx/innerWidth}));
  stars=Array.from({length:RM?60:140},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.1+.3)*DPR,tw:Math.random()*6}));
  const RO=Math.min(W,H)*0.34;
  orbit=Array.from({length:RM?24:64},(_,i)=>({a:Math.random()*6.28,r:RO*(.8+Math.random()*.5),ry:.34,sp:.0016+Math.random()*.001,sz:(Math.random()*1.6+.6)*DPR}));
  bok=Array.from({length:RM?6:15},()=>({x:Math.random()*W,y:Math.random()*H,r:(40+Math.random()*90)*DPR,ph:Math.random()*6,sp:.15+Math.random()*.25,ox:0,oy:0}));
  bok.forEach(b=>{b.ox=b.x;b.oy=b.y;});

build();addEventListener("resize",build);
function dot(px,py,r,col){x.fillStyle=col;x.beginPath();x.arc(px,py,r,0,7);x.fill();}
function frame(now){
  const t=now/1000;p.x+=(p.tx-p.x)*.05;p.y+=(p.ty-p.y)*.05;
  x.fillStyle="#06070a";x.fillRect(0,0,W,H);
  // BACKGROUND stars (subtle parallax)
  const bx=p.x*20*DPR,by=p.y*16*DPR;
  x.globalCompositeOperation="lighter";

  // ORBIT behind (z<0) then front (z>0)
  const ox=p.x*60*DPR,oy=p.y*46*DPR;
  const back=[],front=[];
  for(const o of orbit){o.a+=RM?0:o.sp;const z=Math.sin(o.a);
    const px=cx+Math.cos(o.a)*o.r+ox,py=cy+Math.sin(o.a)*o.r*o.ry+oy;
    const sc=.6+.4*(z*.5+.5);(z<0?back:front).push([px,py,o.sz*sc,z]);}
  for(const[px,py,r] of back)dot(px,py,r,"rgba(120,160,220,0.5)");
  // CORE name particles
  const nx=p.x*30*DPR,ny=p.y*24*DPR,R=120*DPR,R2=R*R,amp=RM?0:1.6*DPR;
  for(const q of name){
    const hx=q.tx+Math.sin(t*q.sp+q.ph)*amp+nx,hy=q.ty+Math.cos(t*q.sp*.9+q.ph)*amp+ny;
    let ax=(hx-q.x)*.022,ay=(hy-q.y)*.022;
    if(p.on){const dx=q.x-p.mx,dy=q.y-p.my,d2=dx*dx+dy*dy;if(d2<R2){const d=Math.sqrt(d2)||1,f=(R-d)/R*6;ax+=dx/d*f;ay+=dy/d*f;}}
    q.vx=(q.vx+ax)*.85;q.vy=(q.vy+ay)*.85;q.x+=q.vx;q.y+=q.vy;
    const r=175+q.c*60|0;x.fillStyle=`rgba(${r},205,255,0.9)`;x.fillRect(q.x,q.y,1.7*DPR,1.7*DPR);
  }
  for(const[px,py,r] of front)dot(px,py,r,"rgba(180,210,255,0.75)");
  // FOREGROUND bokeh (strong parallax)
  const fx=-p.x*90*DPR,fy=-p.y*70*DPR;
  for(const b of bok){const px=b.ox+Math.sin(t*b.sp+b.ph)*40*DPR+fx,py=b.oy+Math.cos(t*b.sp*.8+b.ph)*30*DPR+fy;
    const g=x.createRadialGradient(px,py,0,px,py,b.r);g.addColorStop(0,"rgba(140,175,255,0.10)");g.addColorStop(1,"transparent");

  x.globalCompositeOperation="source-over";

}

</script>

<script>
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const letters=[];
document.querySelectorAll(".line").forEach(line=>{
  for(const ch of line.dataset.t){const s=document.createElement("span");
    if(ch===" "){s.className="sp";}else{s.textContent=ch;s.style.fontVariationSettings='"wght" 400';letters.push(s);}
    line.appendChild(s);}
});
const m={x:-9999,y:-9999};
addEventListener("pointermove",e=>{m.x=e.clientX;m.y=e.clientY;});
addEventListener("pointerleave",()=>{m.x=-9999;m.y=-9999;});
const st=letters.map(()=>({tx:0,ty:0,w:400,x:0,y:0,cw:400}));
function frame(t){
  const R=220;
  letters.forEach((el,i)=>{
    const r=el.getBoundingClientRect(),lx=r.left+r.width/2,ly=r.top+r.height/2;
    const dx=lx-m.x,dy=ly-m.y,d=Math.hypot(dx,dy);
    const s=st[i];
    if(d<R){const f=(1-d/R);s.tx=dx/(d||1)*f*46;s.ty=dy/(d||1)*f*46;s.w=400+f*440;}
    else{s.tx=0;s.ty=0;s.w=400;}
    const wave=RM?0:Math.sin(t*0.0015+i*0.5)*5;
    s.x+=(s.tx-s.x)*.12;s.y+=((s.ty+wave)-s.y)*.12;s.cw+=(s.w-s.cw)*.14;
    el.style.transform=`translate(${s.x.toFixed(2)}px,${s.y.toFixed(2)}px)`;
    el.style.fontVariationSettings='"wght" '+(s.cw|0);
  });
  requestAnimationFrame(frame);
}
if(!RM)requestAnimationFrame(frame);
</script>

<script>
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
/* ---- HUD reticle + readout ---- */
const retic=document.getElementById("retic"),pxy=document.getElementById("pxy");
addEventListener("pointermove",e=>{retic.style.left=e.clientX+"px";retic.style.top=e.clientY+"px";retic.style.opacity=1;
  const nx=(e.clientX/innerWidth-.5)*2,ny=(e.clientY/innerHeight-.5)*2;
  pxy.textContent=`${nx>=0?"+":""}${nx.toFixed(2)} / ${ny>=0?"+":""}${ny.toFixed(2)}`;});
addEventListener("pointerleave",()=>retic.style.opacity=0);

/* ---- animated film grain ---- */
(function(){const g=document.getElementById("grain"),gx=g.getContext("2d");const S=200;g.width=S;g.height=S;
  let f=0;const img=gx.createImageData(S,S);
  function tick(){if(!RM){if(f++%2===0){const d=img.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}gx.putImageData(img,0,0);}requestAnimationFrame(tick);}}
  if(RM){const d=img.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}gx.putImageData(img,0,0);}
  else requestAnimationFrame(tick);})();

if(!window.THREE){document.getElementById("loading").textContent="3D failed to load";}
else (function(){
  const DPR=Math.min(devicePixelRatio||1,RM?1:1.8);
  const canvas=document.getElementById("gl");
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(DPR);renderer.setClearColor(0x050506,1);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.98;renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x050506,0.052);
  const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,120);camera.position.set(0,0.6,9);

  function env(){const c=document.createElement("canvas");c.width=512;c.height=256;const g=c.getContext("2d");
    const base=g.createLinearGradient(0,0,0,256);base.addColorStop(0,"#23262c");base.addColorStop(.5,"#0d0f13");base.addColorStop(1,"#050607");g.fillStyle=base;g.fillRect(0,0,512,256);
    function win(cx,cy,w,h,col,a){const gr=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h));gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;
      g.save();g.translate(cx,cy);g.scale(w/Math.max(w,h),h/Math.max(w,h));g.beginPath();g.arc(0,0,Math.max(w,h),0,7);g.fill();g.restore();}
    win(150,86,64,120,"224,232,244",1.0);win(360,74,54,90,"206,216,230",0.55);win(430,196,80,60,"120,100,78",0.22);
    const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;
    const pm=new THREE.PMREMGenerator(renderer);const e=pm.fromEquirectangular(t).texture;t.dispose();pm.dispose();return e;}
  scene.environment=env();

  const FLOOR=-1.6;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(160,160),
    new THREE.MeshStandardMaterial({color:0x0a0b0e,roughness:.62,metalness:.18,envMapIntensity:.55}));
  floor.rotation.x=-Math.PI/2;floor.position.y=FLOOR;floor.receiveShadow=true;scene.add(floor);
  const wallTex=(()=>{const c=document.createElement("canvas");c.width=256;c.height=256;const g=c.getContext("2d");
    g.fillStyle="#090a0e";g.fillRect(0,0,256,256);const gr=g.createRadialGradient(84,84,0,84,84,150);gr.addColorStop(0,"rgba(150,166,186,.42)");gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);})();
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(90,52),new THREE.MeshStandardMaterial({map:wallTex,roughness:1,metalness:0}));
  wall.position.set(0,6,-16);scene.add(wall);

  scene.add(new THREE.HemisphereLight(0x828c9e,0x050506,.22));
  const key=new THREE.DirectionalLight(0xf2f6ff,2.7);key.position.set(-6,8,5);key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);key.shadow.radius=9;key.shadow.bias=-0.0004;
  const sc=key.shadow.camera;sc.left=-9;sc.right=9;sc.top=9;sc.bottom=-9;sc.near=1;sc.far=34;scene.add(key);
  const fill=new THREE.DirectionalLight(0xb7a488,0.35);fill.position.set(6,2,3);scene.add(fill);

  const glass=()=>new THREE.MeshPhysicalMaterial({transmission:1,thickness:2.3,ior:1.5,roughness:.035,metalness:0,
    iridescence:.06,clearcoat:.5,clearcoatRoughness:.1,envMapIntensity:1.2,
    attenuationColor:new THREE.Color(0x28313d),attenuationDistance:3.2,color:0xdde4ec});

  const group=new THREE.Group();scene.add(group);
  const shapes=[
    {g:new THREE.CylinderGeometry(1.5,1.5,3.0,6,1),x:0,z:-.6,rs:[.0004,.0016,.0006]},
    {g:new THREE.CylinderGeometry(1.0,1.0,1.9,3,1),x:-3.5,z:.5,rs:[.0016,.001,.0006]},
    {g:new THREE.CylinderGeometry(1.1,1.1,2.0,3,1),x:3.3,z:.1,rs:[.0008,.0018,.0007]},
    {g:new THREE.OctahedronGeometry(1.05,0),x:-2.1,z:1.4,rs:[.0012,.001,.0014]},
    {g:new THREE.DodecahedronGeometry(.95,0),x:2.3,z:1.3,rs:[.001,.0014,.0007]},
  ];
  const items=[];
  shapes.forEach((s,i)=>{const geo=s.g;const bb=new THREE.Box3().setFromObject(new THREE.Mesh(geo));const h=bb.max.y-bb.min.y;
    const m=new THREE.Mesh(geo,glass());m.castShadow=true;
    m.position.set(s.x,FLOOR+h/2+(i===0?0:.15),s.z);m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    m.userData={rs:s.rs,fy:Math.random()*6,by:m.position.y};group.add(m);items.push(m);});

  const p={x:0,y:0,tx:0,ty:0};
  addEventListener("pointermove",e=>{p.tx=e.clientX/innerWidth-.5;p.ty=e.clientY/innerHeight-.5;});
  function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
  addEventListener("resize",resize);resize();
  document.getElementById("loading").style.display="none";
  let t0=performance.now();
  function frame(now){const t=(now-t0)/1000;
    p.x+=(p.tx-p.x)*.04;p.y+=(p.ty-p.y)*.04;
    items.forEach(m=>{if(!RM){m.rotation.x+=m.userData.rs[0];m.rotation.y+=m.userData.rs[1];m.rotation.z+=m.userData.rs[2];
      m.position.y=m.userData.by+Math.sin(t*.4+m.userData.fy)*.09;}});
    group.rotation.y=p.x*.26;
    camera.position.x=p.x*1.3;camera.position.y=0.6-p.y*.5;camera.lookAt(0,-0.3,0);
    renderer.render(scene,camera);
    if(!RM)requestAnimationFrame(frame);
  }
  if(RM)frame(0);else requestAnimationFrame(frame);
})();
</script>

<script>
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const DPR=Math.min(devicePixelRatio||1,RM?1:2);
const cv=document.getElementById("c"),x=cv.getContext("2d");
const SEQ=[["MUHAMMAD","AHMAD"],["ENGINEER"],["DESIGNER"],["BUILDER"],["SYSTEMS"],["MUHAMMAD","AHMAD"]];
let W,H,cx,cy,sets=[],core=[],idx=0,timer=0,stars=[],orbit=[],bok=[];
const p={tx:0,ty:0,x:0,y:0,mx:-9999,my:-9999,on:0};
addEventListener("pointermove",e=>{p.tx=e.clientX/innerWidth-.5;p.ty=e.clientY/innerHeight-.5;p.mx=e.clientX*DPR;p.my=e.clientY*DPR;p.on=1;});
addEventListener("pointerleave",()=>p.on=0);
function sample(lines){
  const o=document.createElement("canvas");o.width=innerWidth;o.height=innerHeight;const g=o.getContext("2d");
  g.fillStyle="#fff";g.textAlign="center";g.textBaseline="middle";
  const two=lines.length>1;const fs=Math.min(innerWidth*(two?0.135:0.19),innerHeight*0.24,two?180:240);
  g.font=`800 ${fs}px "Bricolage Grotesque",sans-serif`;
  const X=innerWidth/2,Y=innerHeight*0.42,n=lines.length;
  lines.forEach((ln,i)=>g.fillText(ln,X,Y+(i-(n-1)/2)*fs*0.9));
  const d=g.getImageData(0,0,innerWidth,innerHeight).data,st=innerWidth<720?6:4,pts=[];
  for(let yy=0;yy<innerHeight;yy+=st)for(let xx=0;xx<innerWidth;xx+=st)if(d[(yy*innerWidth+xx)*4+3]>128)pts.push([xx*DPR,yy*DPR]);
  const MAX=innerWidth<720?2600:5000,s=Math.max(1,Math.ceil(pts.length/MAX)),out=[];
  for(let i=0;i<pts.length;i+=s)out.push(pts[i]);return out;
}
function build(){
  W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;cx=W/2;cy=H*0.42;
  sets=SEQ.map(sample);const N=Math.max(...sets.map(s=>s.length));
  core=Array.from({length:N},(_,i)=>{const q=sets[0][i%sets[0].length];
    return {tx:q[0],ty:q[1],x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,ph:Math.random()*6,sp:.4+Math.random()*.7,c:q[0]/W};});
  idx=0;timer=performance.now();
  stars=Array.from({length:RM?60:150},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.1+.3)*DPR,tw:Math.random()*6}));
  const RO=Math.min(W,H)*0.36;
  orbit=Array.from({length:RM?26:70},()=>({a:Math.random()*6.28,r:RO*(.78+Math.random()*.55),ry:.34,sp:.0015+Math.random()*.0011,sz:(Math.random()*1.6+.6)*DPR}));
  bok=Array.from({length:RM?6:15},()=>({x:Math.random()*W,y:Math.random()*H,r:(40+Math.random()*90)*DPR,ph:Math.random()*6,sp:.15+Math.random()*.25,ox:0,oy:0}));
  bok.forEach(b=>{b.ox=b.x;b.oy=b.y;});
}
function assign(){const s=sets[idx];core.forEach((q,i)=>{const t=s[i%s.length];q.tx=t[0];q.ty=t[1];q.c=t[0]/W;});}
build();addEventListener("resize",build);
function dot(px,py,r,col){x.fillStyle=col;x.beginPath();x.arc(px,py,r,0,7);x.fill();}

  if(!RM&&now-timer>3400){idx=(idx+1)%sets.length;assign();timer=now;}
  x.fillStyle="#06070a";x.fillRect(0,0,W,H);
  x.globalCompositeOperation="lighter";
  // BACKGROUND stars
  const bx=p.x*20*DPR,by=p.y*16*DPR;
  for(const s of stars){const a=.3+.4*Math.abs(Math.sin(t*.6+s.tw));dot(s.x+bx,s.y+by,s.r,`rgba(150,175,220,${a})`);}
  // ORBIT rotating dots (behind, then front of the word)
  const ox=p.x*60*DPR,oy=p.y*46*DPR,back=[],front=[];
  for(const o of orbit){o.a+=RM?0:o.sp;const z=Math.sin(o.a);
    const px=cx+Math.cos(o.a)*o.r+ox,py=cy+Math.sin(o.a)*o.r*o.ry+oy;
    const sc=.6+.4*(z*.5+.5);(z<0?back:front).push([px,py,o.sz*sc]);}
  for(const[px,py,r] of back)dot(px,py,r,"rgba(120,160,220,0.5)");

    const hx=q.tx+Math.sin(t*q.sp+q.ph)*amp+nx,hy=q.ty+Math.cos(t*q.sp*.9+q.ph)*amp+ny;
    let ax=(hx-q.x)*.035,ay=(hy-q.y)*.035;
    if(p.on){const dx=q.x-p.mx,dy=q.y-p.my,d2=dx*dx+dy*dy;if(d2<R2){const d=Math.sqrt(d2)||1,f=(R-d)/R*6;ax+=dx/d*f;ay+=dy/d*f;}}
    q.vx=(q.vx+ax)*.85;q.vy=(q.vy+ay)*.85;q.x+=q.vx;q.y+=q.vy;
    const r=175+q.c*60|0;x.fillStyle=`rgba(${r},205,255,0.9)`;x.fillRect(q.x,q.y,1.7*DPR,1.7*DPR);
  }
  for(const[px,py,r] of front)dot(px,py,r,"rgba(180,210,255,0.75)");
  // FOREGROUND bokeh
  const fx=-p.x*90*DPR,fy=-p.y*70*DPR;
  for(const b of bok){const px=b.ox+Math.sin(t*b.sp+b.ph)*40*DPR+fx,py=b.oy+Math.cos(t*b.sp*.8+b.ph)*30*DPR+fy;
    const g=x.createRadialGradient(px,py,0,px,py,b.r);g.addColorStop(0,"rgba(140,175,255,0.10)");g.addColorStop(1,"transparent");
    x.fillStyle=g;x.beginPath();x.arc(px,py,b.r,0,7);x.fill();}
  x.globalCompositeOperation="source-over";
  if(!RM)requestAnimationFrame(frame);
}
if(RM){core.forEach(q=>{q.x=q.tx;q.y=q.ty;});frame(0);}else requestAnimationFrame(frame);
</script>
