<title>Raymarch · SDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Familjen+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{--ink:#05060a;--fg:#eef0f4;--fg-dim:#9aa0ad;--fg-faint:#5a6070;--line:rgba(255,255,255,.13);
    --mono:"JetBrains Mono",ui-monospace,monospace;--body:"Familjen Grotesk",system-ui,sans-serif;--display:"Bricolage Grotesque",system-ui,sans-serif}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--fg);font-family:var(--body);height:100svh;overflow:hidden;-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #scrim{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(5,6,10,.8) 0%,rgba(5,6,10,.35) 34%,transparent 62%),linear-gradient(0deg,rgba(5,6,10,.6),transparent 30%)}
  .mark{position:fixed;top:26px;left:clamp(24px,6vw,64px);z-index:10;font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--fg-dim)}
  .nav{position:fixed;top:24px;right:clamp(24px,6vw,64px);z-index:10;display:flex;gap:26px;font-family:var(--mono);font-size:12px}
  .nav a{color:var(--fg-dim);text-decoration:none}.nav a:hover{color:var(--fg)}
  .hero{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,7vw,110px);max-width:1050px;pointer-events:none}
  .hero *{pointer-events:auto}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--fg-dim);display:flex;align-items:center;gap:12px;margin:0 0 22px}
  .eyebrow::before{content:"";width:32px;height:1px;background:var(--fg-faint)}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,8vw,6.6rem);line-height:.93;letter-spacing:-.03em;margin:0;text-wrap:balance;max-width:13ch}
  .sub{font-size:clamp(1.02rem,1.7vw,1.3rem);line-height:1.5;color:var(--fg-dim);max-width:42ch;margin:24px 0 0}
  .cta{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
  .btn{font-size:15px;font-weight:500;padding:13px 26px;border-radius:100px;cursor:pointer;text-decoration:none;border:1px solid var(--line);color:var(--fg);background:transparent;transition:.25s}
  .btn:hover{background:rgba(255,255,255,.08)}.btn.primary{background:var(--fg);color:#0a0b0e;border-color:var(--fg)}
  .tag{position:fixed;left:clamp(24px,7vw,110px);bottom:26px;z-index:10;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--fg-faint)}
  @media (max-width:720px){.nav{display:none}}
</style>
<canvas id="c"></canvas><div id="scrim"></div>
<div class="mark">MUHAMMAD&nbsp;AHMAD</div>
<nav class="nav"><a href="#">Work</a><a href="#">About</a><a href="#">Contact</a></nav>
<div class="hero"><p class="eyebrow">Engineer · Builder</p>
  <h1>Made of math.</h1>
  <p class="sub">I build interfaces, tools, and systems. This entire background is one equation, raymarched live on the GPU.</p>
  <div class="cta"><a class="btn primary" href="#">View work</a><a class="btn" href="#">Get in touch</a></div></div>
<div class="tag">RAYMARCHED GYROID · WEBGL2 FRAGMENT SHADER</div>
<script>
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const DPR=Math.min(devicePixelRatio||1,RM?1:1.5);
const cv=document.getElementById("c"),gl=cv.getContext("webgl2");
const m={x:0,y:0,tx:0,ty:0};addEventListener("pointermove",e=>{m.tx=e.clientX/innerWidth-.5;m.ty=e.clientY/innerHeight-.5;});
const FS=`#version 300 es
precision highp float;uniform vec2 uRes;uniform float uTime;uniform vec2 uM;out vec4 o;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float map(vec3 p){p.xy*=rot(p.z*0.05);float g=dot(sin(p),cos(p.yzx));return (abs(g)-0.55)*0.33;}
vec3 nr(vec3 p){vec2 e=vec2(0.0025,0.);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}
void main(){vec2 uv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;
  vec3 ro=vec3(0.,0.,uTime*0.7);vec3 rd=normalize(vec3(uv,1.2));rd.xy*=rot(uM.x*0.7);rd.yz*=rot(-uM.y*0.55);
  float t=0.,d;for(int i=0;i<74;i++){vec3 p=ro+rd*t;d=map(p);if(d<0.001||t>20.)break;t+=d*0.8;}
  vec3 col=vec3(0.015,0.02,0.035);
  if(t<20.){vec3 p=ro+rd*t,n=nr(p);float fr=pow(1.-max(dot(n,-rd),0.),3.);
    vec3 base=0.5+0.5*cos(6.283*(n.y*0.5+vec3(0.,0.33,0.67))+uTime*0.13);
    float df=max(dot(n,normalize(vec3(1,2,-1))),0.);col=base*0.32+df*0.5+fr*vec3(0.7,0.85,1.);col*=exp(-t*0.07);}
  o=vec4(pow(col,vec3(0.92)),1.);}`;
const VS=`#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(pr,"uRes"),uT=gl.getUniformLocation(pr,"uTime"),uM=gl.getUniformLocation(pr,"uM");
function size(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;gl.viewport(0,0,cv.width,cv.height);}
size();addEventListener("resize",size);
function frame(now){m.x+=(m.tx-m.x)*.05;m.y+=(m.ty-m.y)*.05;
  gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,now/1000);gl.uniform2f(uM,m.x,m.y);gl.drawArrays(gl.TRIANGLES,0,3);
  if(!RM)requestAnimationFrame(frame);}
frame(RM?2000:0);
</script>
