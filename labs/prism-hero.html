<title>Prism Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Familjen+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#07070c;--fg:#f2f3f7;--fg-dim:#a5a8b6;--fg-faint:#5f6272;--line:rgba(255,255,255,.14);
    --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Familjen Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--fg);font-family:var(--body);height:100svh;overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;
    background:
      radial-gradient(60% 50% at 50% 34%, rgba(120,110,255,.16), transparent 70%),
      radial-gradient(50% 45% at 72% 60%, rgba(60,200,230,.10), transparent 70%),
      radial-gradient(120% 100% at 50% 20%, #101126, #07070c 72%)}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:radial-gradient(circle,#fff 0.5px,transparent 0.6px);background-size:3px 3px}
  #scrim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 70% at 50% 56%,transparent 40%,rgba(7,7,12,.55))}
  #loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-faint);font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase}

  nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
    padding:22px clamp(24px,6vw,64px);font-family:var(--mono);font-size:12px;letter-spacing:.14em}
  nav .brand{color:var(--fg);font-weight:500}
  nav .links{display:flex;gap:28px}
  nav a{color:var(--fg-dim);text-decoration:none;transition:color .2s}nav a:hover{color:var(--fg)}

  .hero{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 24px;pointer-events:none}
  .hero>*{pointer-events:auto}
  .badge{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;
    padding:8px 16px;border-radius:100px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg-dim);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:30px}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#57e389;box-shadow:0 0 10px #57e389}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2.7rem,7.4vw,6rem);line-height:.96;letter-spacing:-.035em;margin:0;max-width:16ch;text-wrap:balance}
  h1 .g{background:linear-gradient(100deg,#c9b8ff,#8fd6ff 60%,#f5c2e7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:clamp(1.02rem,1.7vw,1.28rem);line-height:1.5;color:var(--fg-dim);max-width:48ch;margin:26px 0 0;font-weight:400}
  .cta{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:var(--body);font-size:15px;font-weight:500;padding:14px 28px;border-radius:100px;cursor:pointer;text-decoration:none;
    border:1px solid var(--line);color:var(--fg);background:transparent;transition:background .25s,transform .2s,box-shadow .25s}
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:var(--fg);color:#0a0b12;border-color:var(--fg);box-shadow:0 8px 30px rgba(180,190,255,.25)}
  .btn.primary:hover{box-shadow:0 10px 36px rgba(180,190,255,.4)}
  .btn.ghost:hover{background:rgba(255,255,255,.06)}
  .foot{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--fg-faint);text-transform:uppercase}
  @media (max-width:720px){nav .links{display:none}}
</style>

<div id="stage">
  <canvas id="gl"></canvas>
  <div id="grain"></div><div id="scrim"></div>
  <div id="loading">rendering glass…</div>
</div>

<nav>
  <span class="brand">MUHAMMAD AHMAD</span>
  <span class="links"><a href="#">Work</a><a href="#">About</a><a href="#">Writing</a><a href="#">Contact</a></span>
</nav>

<div class="hero">
  <span class="badge"><span class="dot"></span> Available for new work</span>
  <h1>I build software<br>that feels <span class="g">alive</span>.</h1>
  <p class="sub">Engineer and designer shipping interfaces, tools, and systems — with an eye for how they move, not just what they do.</p>
  <div class="cta"><a class="btn primary" href="#">View the work</a><a class="btn ghost" href="#">Get in touch</a></div>
</div>
<div class="foot">move the cursor · scroll to enter</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!window.THREE){document.getElementById("loading").textContent="3D failed to load";}
else (function(){
  const DPR=Math.min(devicePixelRatio||1,RM?1:1.8);
  const canvas=document.getElementById("gl");
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(DPR);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.outputEncoding=THREE.sRGBEncoding;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,0,10);

  // bright studio environment -> crisp glass refraction/reflection
  function env(){const c=document.createElement("canvas");c.width=512;c.height=256;const g=c.getContext("2d");
    const grd=g.createLinearGradient(0,0,0,256);grd.addColorStop(0,"#5a63a8");grd.addColorStop(.45,"#20233f");grd.addColorStop(1,"#050610");g.fillStyle=grd;g.fillRect(0,0,512,256);
    for(const[x,y,col,r] of[[130,70,"#ffffff",70],[380,54,"#b9c4ff",90],[260,150,"#8ff0ff",70],[70,180,"#ffc9ec",60],[440,190,"#ffffff",40]]){
      const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,col);rg.addColorStop(1,"transparent");g.fillStyle=rg;g.fillRect(0,0,512,256);}
    const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;
    const pm=new THREE.PMREMGenerator(renderer);const e=pm.fromEquirectangular(t).texture;t.dispose();pm.dispose();return e;}
  scene.environment=env();

  scene.add(new THREE.HemisphereLight(0xc7d0ff,0x0a0a14,.5));
  const key=new THREE.DirectionalLight(0xffffff,1.3);key.position.set(3,5,6);scene.add(key);
  const l1=new THREE.PointLight(0x8b5cf6,55,50);l1.position.set(-7,3,4);scene.add(l1);
  const l2=new THREE.PointLight(0x22d3ee,50,50);l2.position.set(7,-3,3);scene.add(l2);

  const glass=new THREE.MeshPhysicalMaterial({
    transmission:1, thickness:2.6, ior:1.52, roughness:.015, metalness:0,
    iridescence:1, iridescenceIOR:1.32, iridescenceThicknessRange:[130,460],
    clearcoat:1, clearcoatRoughness:.04, envMapIntensity:1.9,
    attenuationColor:new THREE.Color(0xcfe0ff), attenuationDistance:6, color:0xffffff });

  const group=new THREE.Group();scene.add(group);
  // hero cluster: triangular glass prisms framing the centred text
  const defs=[
    {r:1.7,h:3.0,x:0,y:1.5,z:-1,sp:1},
    {r:1.0,h:1.7,x:-3.7,y:1.7,z:.4,sp:.8},
    {r:1.2,h:1.9,x:3.6,y:.4,z:0,sp:1.15},
    {r:.8,h:1.35,x:-2.6,y:-1.9,z:.8,sp:1.3},
    {r:.7,h:1.2,x:2.7,y:-2.1,z:.6,sp:.9},
  ];
  const prisms=[];
  for(const d of defs){const m=new THREE.Mesh(new THREE.CylinderGeometry(d.r,d.r,d.h,3,1),glass);
    m.position.set(d.x,d.y,d.z);m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    m.userData={sp:d.sp,fy:Math.random()*6,by:d.y};group.add(m);prisms.push(m);}
  // tiny chrome accents for sparkle
  const chrome=new THREE.MeshStandardMaterial({color:0xeaf0ff,metalness:1,roughness:.12,envMapIntensity:1.5});
  for(let i=0;i<6;i++){const s=new THREE.Mesh(new THREE.OctahedronGeometry(.16),chrome);
    s.position.set((Math.random()-.5)*11,(Math.random()-.5)*7,(Math.random()-.5)*3-1);group.add(s);}

  const p={x:0,y:0,tx:0,ty:0};
  addEventListener("pointermove",e=>{p.tx=e.clientX/innerWidth-.5;p.ty=e.clientY/innerHeight-.5;});
  function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
  addEventListener("resize",resize);resize();
  document.getElementById("loading").style.display="none";

  let t0=performance.now();
  function frame(now){
    const t=(now-t0)/1000;
    p.x+=(p.tx-p.x)*.045;p.y+=(p.ty-p.y)*.045;
    prisms.forEach(m=>{if(!RM){m.rotation.y+=.0035*m.userData.sp;m.rotation.x+=.0015*m.userData.sp;
      m.position.y=m.userData.by+Math.sin(t*.5+m.userData.fy)*.18;}});
    group.rotation.y=p.x*.5;group.rotation.x=p.y*.32;
    camera.position.x=p.x*1.1;camera.position.y=-p.y*.7;camera.lookAt(0,.4,0);
    renderer.render(scene,camera);
    if(!RM)requestAnimationFrame(frame);
  }
  if(RM)frame(0);else requestAnimationFrame(frame);
})();
</script>
